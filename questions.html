<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Question Bank — AWS CLF-C02</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0b0e14;--bg2:#111520;--bg3:#181d2a;--bg4:#1e2435;
      --border:#232b3e;--border2:#2e3a52;
      --text:#e2e8f4;--muted:#6b7a99;
      --aws:#ff9900;--aws-dim:#b36d00;--aws-glow:rgba(255,153,0,0.1);
      --green:#22c55e;--green-bg:rgba(34,197,94,0.08);--green-bdr:rgba(34,197,94,0.3);
      --red:#ef4444;--blue:#60a5fa;--purple:#a78bfa;--teal:#34d399;--yellow:#facc15;
      --radius:10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-size:15px;min-height:100vh;}

    /* NAV */
    .topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .topnav-left{display:flex;align-items:center;gap:18px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;transition:color .15s;font-family:'IBM Plex Mono',monospace;}
    .back-link:hover{color:var(--aws);}
    .nav-div{width:1px;height:20px;background:var(--border);}
    .nav-title{font-size:13px;font-weight:600;}
    .total-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--aws-glow);border:1px solid var(--aws-dim);color:var(--aws);padding:3px 12px;border-radius:99px;}

    /* LAYOUT */
    .page-layout{display:flex;min-height:calc(100vh - 54px);}

    /* SIDEBAR */
    .filter-sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;display:flex;flex-direction:column;gap:22px;}
    .fg-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;font-family:'IBM Plex Mono',monospace;}
    .search-wrap{position:relative;}
    .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
    #search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Sora',sans-serif;font-size:13px;padding:9px 12px 9px 33px;outline:none;transition:border-color .15s;}
    #search-input::placeholder{color:var(--muted);}
    #search-input:focus{border-color:var(--aws);}
    .chips{display:flex;flex-direction:column;gap:5px;}
    .chip{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;text-align:left;width:100%;}
    .chip:hover{border-color:var(--border2);color:var(--text);background:var(--bg3);}
    .chip.active{background:var(--bg3);border-color:var(--border2);color:var(--text);}
    .chip-l{display:flex;align-items:center;gap:8px;}
    .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--bg4);border:1px solid var(--border);border-radius:99px;padding:1px 8px;color:var(--muted);}
    .chip.active .cnt{color:var(--text);}
    /* exam active */
    .chip.ec.active{border-color:var(--aws-dim);color:var(--aws);background:var(--aws-glow);}
    .chip.ec.active .cnt{border-color:var(--aws-dim);color:var(--aws);}
    /* domain active */
    .chip[data-domain="Cloud Concepts"].active{border-color:rgba(96,165,250,.4);color:var(--blue);background:rgba(96,165,250,.06);}
    .chip[data-domain="Security and Compliance"].active{border-color:rgba(167,139,250,.4);color:var(--purple);background:rgba(167,139,250,.06);}
    .chip[data-domain="Technology"].active{border-color:var(--aws-dim);color:var(--aws);background:var(--aws-glow);}
    .chip[data-domain="Billing and Pricing"].active{border-color:rgba(52,211,153,.4);color:var(--teal);background:rgba(52,211,153,.06);}
    /* type active */
    .chip[data-type="single"].active{border-color:rgba(96,165,250,.4);color:var(--blue);background:rgba(96,165,250,.06);}
    .chip[data-type="multiple"].active{border-color:rgba(250,204,21,.4);color:var(--yellow);background:rgba(250,204,21,.06);}
    .clear-btn{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;margin-top:4px;}
    .clear-btn:hover{color:var(--aws);border-color:var(--aws-dim);}

    /* MAIN */
    .main-content{flex:1;padding:28px 36px;min-width:0;}
    .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
    .stat-tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:center;}
    .sv{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-bottom:3px;}
    .sl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
    .st-t .sv{color:var(--aws);} .st-s .sv{color:var(--blue);} .st-m .sv{color:var(--yellow);} .st-d .sv{color:var(--teal);}

    .results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
    .rc{font-size:13px;color:var(--muted);}
    .rc span{color:var(--text);font-weight:600;}
    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .sort-sel{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Sora',sans-serif;font-size:12px;padding:6px 12px;outline:none;cursor:pointer;}
    .view-toggle{display:flex;gap:4px;}
    .vbtn{padding:6px 14px;border:1px solid var(--border);background:transparent;border-radius:6px;color:var(--muted);font-size:12px;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;}
    .vbtn.active{background:var(--bg3);border-color:var(--border2);color:var(--text);}

    /* QUESTION CARDS */
    #qc{display:flex;flex-direction:column;gap:10px;}
    #qc.grid-view{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

    .qcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s;}
    .qcard:hover{border-color:var(--border2);}
    .qcard[data-domain="Cloud Concepts"]         {border-left:3px solid rgba(96,165,250,.5);}
    .qcard[data-domain="Security and Compliance"]{border-left:3px solid rgba(167,139,250,.5);}
    .qcard[data-domain="Technology"]             {border-left:3px solid rgba(255,153,0,.5);}
    .qcard[data-domain="Billing and Pricing"]    {border-left:3px solid rgba(52,211,153,.5);}

    .qcard-hdr{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;}
    .qcard-hdr:hover{background:rgba(255,255,255,.015);}
    .qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;flex-shrink:0;white-space:nowrap;}
    .qmeta{flex:1;min-width:0;}
    .qtags{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap;}
    .tag{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 9px;border-radius:99px;border:1px solid var(--border);}
    .t-cc  {color:var(--blue);  border-color:rgba(96,165,250,.3); background:rgba(96,165,250,.06);}
    .t-sec {color:var(--purple);border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.06);}
    .t-tech{color:var(--aws);   border-color:var(--aws-dim);      background:var(--aws-glow);}
    .t-bill{color:var(--teal);  border-color:rgba(52,211,153,.3); background:rgba(52,211,153,.06);}
    .t-multi{color:var(--yellow);border-color:rgba(250,204,21,.3);background:rgba(250,204,21,.06);}
    .t-single{color:var(--blue);border-color:rgba(96,165,250,.3); background:rgba(96,165,250,.06);}
    .qtext{font-size:14px;font-weight:500;line-height:1.6;}
    #qc.grid-view .qtext{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    #qc.grid-view .qcard.open .qtext{display:block;-webkit-line-clamp:unset;}
    .qchev{font-size:12px;color:var(--muted);flex-shrink:0;margin-top:2px;transition:transform .2s;}
    .qcard.open .qchev{transform:rotate(180deg);}

    .qcard-body{display:none;padding:0 18px 18px 18px;}
    .qcard.open .qcard-body{display:block;}

    .qopts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
    .qopt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;line-height:1.5;background:var(--bg3);}
    .qopt.oc{border-color:var(--green-bdr);background:var(--green-bg);}
    .qopt-icon{font-size:13px;flex-shrink:0;width:18px;text-align:center;margin-top:1px;}
    .oc .qopt-text{color:var(--green);font-weight:500;}
    .oc-lbl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--green);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);border-radius:4px;padding:1px 7px;white-space:nowrap;align-self:flex-start;margin-top:2px;flex-shrink:0;}

    .qexp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
    .qexp-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:7px;}
    .qexp-txt{font-size:13px;color:var(--muted);line-height:1.7;}

    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--muted);gap:12px;text-align:center;}
    .empty .ei{font-size:40px;} .empty .et{font-size:16px;font-weight:600;color:var(--text);} .empty .es{font-size:13px;}

    /* LOADER */
    #loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200;transition:opacity .3s;}
    #loader.hidden{opacity:0;pointer-events:none;}
    .lb-wrap{width:280px;height:3px;background:var(--border);border-radius:99px;overflow:hidden;}
    .lb-fill{height:100%;background:var(--aws);border-radius:99px;transition:width .3s ease;}
    .lt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
    .ll{font-size:20px;font-weight:700;color:var(--aws);font-family:'IBM Plex Mono',monospace;}

    ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

    @media(max-width:900px){
      .filter-sidebar{display:none;}
      .main-content{padding:20px 16px;}
      .stats-bar{grid-template-columns:1fr 1fr;}
      #qc.grid-view{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="ll">AWS CLF-C02</div>
  <div class="lb-wrap"><div class="lb-fill" id="lb" style="width:0%"></div></div>
  <div class="lt" id="lt">Loading exam 1 of 6…</div>
</div>

<nav class="topnav">
  <div class="topnav-left">
    <a class="back-link" href="index.html">← Portal Home</a>
    <div class="nav-div"></div>
    <span class="nav-title">Question Bank</span>
  </div>
  <div class="total-badge" id="nav-total">Loading…</div>
</nav>

<div class="page-layout">

  <aside class="filter-sidebar">
    <div>
      <div class="fg-label">Search</div>
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search questions…" oninput="run()"/>
      </div>
    </div>

    <div>
      <div class="fg-label">Exam Set</div>
      <div class="chips" id="exam-chips">
        <button class="chip ec active" data-exam="all" onclick="pick('exam','all',this)"><span class="chip-l"><span>All Exams</span></span><span class="cnt" id="ec-all">—</span></button>
        <button class="chip ec" data-exam="1"  onclick="pick('exam','1',this)"><span class="chip-l"><span>Exam 1</span></span><span class="cnt" id="ec-1">—</span></button>
        <button class="chip ec" data-exam="2"  onclick="pick('exam','2',this)"><span class="chip-l"><span>Exam 2</span></span><span class="cnt" id="ec-2">—</span></button>
        <button class="chip ec" data-exam="3"  onclick="pick('exam','3',this)"><span class="chip-l"><span>Exam 3</span></span><span class="cnt" id="ec-3">—</span></button>
        <button class="chip ec" data-exam="4"  onclick="pick('exam','4',this)"><span class="chip-l"><span>Exam 4</span></span><span class="cnt" id="ec-4">—</span></button>
        <button class="chip ec" data-exam="5"  onclick="pick('exam','5',this)"><span class="chip-l"><span>Exam 5</span></span><span class="cnt" id="ec-5">—</span></button>
        <button class="chip ec" data-exam="6"  onclick="pick('exam','6',this)"><span class="chip-l"><span>Exam 6</span></span><span class="cnt" id="ec-6">—</span></button>
      </div>
    </div>

    <div>
      <div class="fg-label">Domain</div>
      <div class="chips">
        <button class="chip active" data-domain="all" onclick="pick('domain','all',this)"><span class="chip-l"><div class="cdot" style="background:var(--aws)"></div><span>All Domains</span></span><span class="cnt" id="dc-all">—</span></button>
        <button class="chip" data-domain="Cloud Concepts" onclick="pick('domain','Cloud Concepts',this)"><span class="chip-l"><div class="cdot" style="background:var(--blue)"></div><span>Cloud Concepts</span></span><span class="cnt" id="dc-cc">—</span></button>
        <button class="chip" data-domain="Security and Compliance" onclick="pick('domain','Security and Compliance',this)"><span class="chip-l"><div class="cdot" style="background:var(--purple)"></div><span>Security &amp; Compliance</span></span><span class="cnt" id="dc-sec">—</span></button>
        <button class="chip" data-domain="Technology" onclick="pick('domain','Technology',this)"><span class="chip-l"><div class="cdot" style="background:var(--aws)"></div><span>Technology</span></span><span class="cnt" id="dc-tech">—</span></button>
        <button class="chip" data-domain="Billing and Pricing" onclick="pick('domain','Billing and Pricing',this)"><span class="chip-l"><div class="cdot" style="background:var(--teal)"></div><span>Billing &amp; Pricing</span></span><span class="cnt" id="dc-bill">—</span></button>
      </div>
    </div>

    <div>
      <div class="fg-label">Question Type</div>
      <div class="chips">
        <button class="chip active" data-type="all"      onclick="pick('type','all',this)"><span class="chip-l"><span>All Types</span></span><span class="cnt" id="tc-all">—</span></button>
        <button class="chip" data-type="single"   onclick="pick('type','single',this)"><span class="chip-l"><span>⊙ Single Answer</span></span><span class="cnt" id="tc-s">—</span></button>
        <button class="chip" data-type="multiple" onclick="pick('type','multiple',this)"><span class="chip-l"><span>☑ Multiple Answer</span></span><span class="cnt" id="tc-m">—</span></button>
      </div>
    </div>

    <button class="clear-btn" onclick="clearAll()">↺ Clear All Filters</button>
  </aside>

  <main class="main-content">
    <div class="stats-bar">
      <div class="stat-tile st-t"><div class="sv" id="st-t">—</div><div class="sl">Total Questions</div></div>
      <div class="stat-tile st-s"><div class="sv" id="st-s">—</div><div class="sl">Single Answer</div></div>
      <div class="stat-tile st-m"><div class="sv" id="st-m">—</div><div class="sl">Multiple Answer</div></div>
      <div class="stat-tile st-d"><div class="sv">4</div><div class="sl">Domains</div></div>
    </div>

    <div class="results-bar">
      <div class="rc" id="rc">Showing <span>0</span> questions</div>
      <div class="controls">
        <select class="sort-sel" id="sort-sel" onchange="run()">
          <option value="default">Sort: Default order</option>
          <option value="exam">Sort: By Exam</option>
          <option value="domain">Sort: By Domain</option>
          <option value="type">Sort: By Type</option>
        </select>
        <div class="view-toggle">
          <button class="vbtn active" id="vb-l" onclick="setView('list')">≡ List</button>
          <button class="vbtn" id="vb-g" onclick="setView('grid')">⊞ Grid</button>
        </div>
      </div>
    </div>

    <div id="qc"></div>

    <div style="margin-top:40px;border-top:1px solid var(--border);padding:20px 0;text-align:center;color:var(--muted);font-size:12px;">
      AWS CLF-C02 Question Bank &nbsp;·&nbsp; BIFE &nbsp;·&nbsp;
      <a href="index.html" style="color:var(--aws);text-decoration:none;">Back to Portal</a>
    </div>
  </main>
</div>

<script>
const TOTAL = 6;
let all = [], filters = {exam:'all',domain:'all',type:'all'};

const dTagCls = {'Cloud Concepts':'t-cc','Security and Compliance':'t-sec','Technology':'t-tech','Billing and Pricing':'t-bill'};

function loadScript(n){
  return new Promise(resolve=>{
    if(window.EXAM_DATA) delete window.EXAM_DATA;
    const s = document.createElement('script');
    s.src = `data/exam${n}.js?t=${Date.now()}`;
    s.onload = ()=>{
      if(window.EXAM_DATA?.questions){
        const en = window.EXAM_DATA.examNumber, et = window.EXAM_DATA.title;
        window.EXAM_DATA.questions.forEach(q=>{
          all.push({...q, examNumber:en, examTitle:et,
            qType: q.options.filter(o=>o.correct).length>1?'multiple':'single',
            uid:`e${en}-q${q.questionNumber}`});
        });
      }
      resolve();
    };
    s.onerror = ()=>resolve();
    document.head.appendChild(s);
  });
}

async function boot(){
  const lb=document.getElementById('lb'), lt=document.getElementById('lt');
  for(let i=1;i<=TOTAL;i++){
    lt.textContent=`Loading exam ${i} of ${TOTAL}…`;
    await loadScript(i);
    lb.style.width=`${(i/TOTAL)*100}%`;
  }
  setCounts(); run();
  const ov=document.getElementById('loader');
  ov.classList.add('hidden');
  setTimeout(()=>ov.remove(),400);
}

function setCounts(){
  const n=all.length, s=all.filter(q=>q.qType==='single').length, m=all.filter(q=>q.qType==='multiple').length;
  document.getElementById('nav-total').textContent=`${n} questions`;
  document.getElementById('st-t').textContent=n;
  document.getElementById('st-s').textContent=s;
  document.getElementById('st-m').textContent=m;
  document.getElementById('ec-all').textContent=n;
  document.getElementById('dc-all').textContent=n;
  document.getElementById('tc-all').textContent=n;
  document.getElementById('tc-s').textContent=s;
  document.getElementById('tc-m').textContent=m;
  for(let i=1;i<=TOTAL;i++){const el=document.getElementById(`ec-${i}`);if(el)el.textContent=all.filter(q=>q.examNumber===i).length;}
  document.getElementById('dc-cc').textContent=all.filter(q=>q.domain==='Cloud Concepts').length;
  document.getElementById('dc-sec').textContent=all.filter(q=>q.domain==='Security and Compliance').length;
  document.getElementById('dc-tech').textContent=all.filter(q=>q.domain==='Technology').length;
  document.getElementById('dc-bill').textContent=all.filter(q=>q.domain==='Billing and Pricing').length;
}

function pick(type,val,btn){
  filters[type]=val;
  const grp=btn.closest('.chips');
  grp.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  run();
}

function clearAll(){
  filters={exam:'all',domain:'all',type:'all'};
  document.getElementById('search-input').value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.chip[data-exam="all"],.chip[data-domain="all"],.chip[data-type="all"]').forEach(c=>c.classList.add('active'));
  run();
}

function run(){
  const q=document.getElementById('search-input').value.toLowerCase().trim();
  const sort=document.getElementById('sort-sel').value;
  let list=all.filter(item=>{
    if(filters.exam!=='all'&&String(item.examNumber)!==filters.exam) return false;
    if(filters.domain!=='all'&&item.domain!==filters.domain) return false;
    if(filters.type!=='all'&&item.qType!==filters.type) return false;
    if(q){
      const h=(item.questionText+' '+item.options.map(o=>o.text).join(' ')+' '+item.explanation).toLowerCase();
      if(!h.includes(q)) return false;
    }
    return true;
  });
  if(sort==='exam')   list.sort((a,b)=>a.examNumber-b.examNumber||a.questionNumber-b.questionNumber);
  if(sort==='domain') list.sort((a,b)=>a.domain.localeCompare(b.domain)||a.examNumber-b.examNumber);
  if(sort==='type')   list.sort((a,b)=>a.qType.localeCompare(b.qType)||a.examNumber-b.examNumber);
  render(list);
}

function render(list){
  const container=document.getElementById('qc');
  document.getElementById('rc').innerHTML=`Showing <span>${list.length}</span> question${list.length!==1?'s':''}`;
  if(!list.length){
    container.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">No questions found</div><div class="es">Try adjusting your filters or search term</div></div>';
    return;
  }
  container.innerHTML='';
  list.forEach(q=>{
    const dc=dTagCls[q.domain]||'t-tech';
    const typeTag=q.qType==='multiple'
      ?'<span class="tag t-multi">MULTI-SELECT</span>'
      :'<span class="tag t-single">SINGLE</span>';
    let optsHtml='';
    q.options.forEach((opt,idx)=>{
      const letter=String.fromCharCode(65+idx);
      optsHtml+=opt.correct
        ?`<div class="qopt oc"><span class="qopt-icon" style="color:var(--green)">✓</span><span class="qopt-text">${opt.text}</span><span class="oc-lbl">Correct</span></div>`
        :`<div class="qopt"><span class="qopt-icon" style="color:var(--muted)">${letter}</span><span class="qopt-text" style="color:var(--muted)">${opt.text}</span></div>`;
    });
    const card=document.createElement('div');
    card.className='qcard';
    card.dataset.domain=q.domain;
    card.id=`qc-${q.uid}`;
    card.innerHTML=`
      <div class="qcard-hdr" onclick="tog('${q.uid}')">
        <div class="qnum">E${q.examNumber} · Q${q.questionNumber}</div>
        <div class="qmeta">
          <div class="qtags"><span class="tag ${dc}">${q.domain}</span>${typeTag}</div>
          <div class="qtext">${q.questionText}</div>
        </div>
        <div class="qchev">▼</div>
      </div>
      <div class="qcard-body">
        <div class="qopts">${optsHtml}</div>
        <div class="qexp">
          <div class="qexp-lbl">💡 Explanation</div>
          <div class="qexp-txt">${q.explanation}</div>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function tog(uid){document.getElementById(`qc-${uid}`)?.classList.toggle('open');}

function setView(v){
  const c=document.getElementById('qc');
  document.getElementById('vb-l').classList.toggle('active',v==='list');
  document.getElementById('vb-g').classList.toggle('active',v==='grid');
  c.classList.toggle('grid-view',v==='grid');
}

boot();
</script>
</body>
</html>
